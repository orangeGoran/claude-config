kind: added
audience: both
scope: dashboard
summary: |
  Shipyard is an optional Mac app that shows the dashboard in its own window, with the ⌘ keys that a browser keeps for itself: ⌘1–9 for tabs, ⇧⌘[ / ⇧⌘], ⌘W, ⇧⌘T, ⌘K, ⌘L (chat box), ⌘B (board), ⌘, (Settings), and ⌘+ / ⌘− / ⌘0 for the page size. The page's header row is the window's title bar. Run npm run build-app to build and install it in ~/Applications (it needs the Swift compiler of the Command Line Tools); scripts/setup.sh asks before it builds it. Closing the window only hides it: runs and chats keep going. The default dashboard domain is now https://shipyard.test; an existing install keeps its domain until you run scripts/setup-macos.sh --domain shipyard.test. After the pull, restart the dashboard (check pgrep -fl chat-relay.mjs first) and reload the page, because the page has three new hooks.
internal: |
  New folder apps/plans-mac/: src/main.swift (AppKit + WKWebView, no Xcode project) and build.mjs (xcrun swiftc -swift-version 5 -target <arch>-apple-macos13.0, ad hoc codesign, staged install to ~/Applications/Shipyard.app through .new / .old folders; --url, --out, --no-install, --check). The URL comes from ~/.claude/pipeline-dashboard/caddy-site.caddy, else https://shipyard.test; only https is accepted. Bundle id com.plans-dashboard.mac.
  The app calls the page only through window.dashboard; the page adds focusChat(), toggleBoard() and openSettings(), each behind tabHook, and .claude/settings.json allows npm run build-app. Menu calls go only to a visible window that shows the app's origin; other origins, target=_blank, window.open, vscode: and downloads open in the default browser. alert() and confirm() are native sheets. The window has a full-size content view with a hidden title: the window buttons sit in the page header (the app's own WKUserScript gives the header room for them and posts "drag" / "zoom" to the plans message handler from an empty header part; the page has no app code for it). WKWebView.pageZoom is kept in UserDefaults. A connection error, a certificate error or a Caddy 502/503/504 shows a waiting page that retries every 5 s.
  New npm script build-app.
customer:
  en: The plans dashboard now has an optional Mac app, Shipyard. It shows the dashboard in its own window with ⌘ shortcuts for tabs, the board, the chat box and Settings. Closing the window keeps your runs and chats going in the background.
