kind: added
audience: both
scope: dashboard
summary: |
  The dashboard can now tell when a contracts submodule falls behind its upstream, and propose one update. Type the submodule path (for example contracts) in the new Watch submodules field in ⚙ Settings. Once a minute the dashboard compares the pin with the upstream branch; when the pin is behind, it shows one notification, and a click opens the ☑ Checklist of the project's group. There a "Contracts jump" box recommends one jump after the open, non-draft upstream PRs, with one ticked box per PR. Untick what you do not want and click Confirm: the dashboard writes one jump plan with one "Waits for" line per PR and shows the three commands that push it. Push the plan; it starts by itself when all its PRs are merged. With no open upstream PR, the box offers "jump now", which you launch by hand after the push. After the pull, run pgrep -fl chat-relay.mjs, and run npm run restart only when it shows that the live chats run under the relay.
internal: |
  New apps/dashboard/contracts-jump.mjs (no imports): safeSubPath, parseSubPaths, launcherBase, submoduleBranch, repoKey, parseJumpLine, jumpPathPart, jumpSlug, planStamp, recommendJump, jumpPlanText. Registry entries take an optional watchSubmodules (max 8 good paths; Settings warns about dropped ones). Watcher step 5b (checkWatchedSubs → checkSubmodule) writes watch.json "subs" (base from BASE_BRANCH of auto-pipeline.sh, branch from .gitmodules on origin/<base> or origin/HEAD, pin, tip, relation equal/behind/ahead/diverged, upstream by repoKey of origin, the open upstream PRs and the open jump PRs read in full, max 5 pages) and adds the events submodule-behind (one per new tip, with a notification that opens ?checklist=<group>) and submodule-error (one per new reason). GET /api/ledger adds "contracts" (jumpCards: one card per watched path, state unchecked/error/diverged/blocked/batch/now/up-to-date, blockers with pushed and the push commands). New POST /api/contracts/jump { project, path, prs } writes one jump plan with flag wx and never commits or pushes it. Page: Watch submodules input in Settings, jumpCardHtml/bindJumpCard in the checklist (unticked boxes survive repaints, for the open page only), the ?checklist=<group> opener. Bootstrap: new module contracts-jump, off by default (DEFAULT_OFF in render.mjs, moduleOn), with a /contracts-jump skill and an AGENTS.md line; the step gate (workflow-guard.sh) now reads the worktree the commit runs in (cd and -C folders in shell order from the hook input's cwd, followed to their real folders; same repo by git common dir) and blocks a commit whose folder it cannot tell: a cd in a subshell, a pipeline part or a background part does not move the folder; a cd that may not run (after ||, a keyword, or && with a ; before the commit), pushd/popd, --git-dir, --work-tree, GIT_DIR-style variables, a folder that is no worktree and a nested command that moves the folder are blocked; an escaped quote no longer hides a commit; /skill-auto-validate-plan takes --max-rounds <1-4> (default 4). This repo's own .claude/scripts/workflow-guard.sh and .claude/skills/skill-auto-validate-plan/SKILL.md need the same changes by hand (a headless run cannot write .claude/).
customer:
  en: The dashboard can now tell you when a contracts submodule is behind its upstream, and propose one update that starts by itself when the upstream pull requests are merged.
