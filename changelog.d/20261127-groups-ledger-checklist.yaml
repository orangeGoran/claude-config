kind: added
audience: both
scope: dashboard
summary: |
  Repos that share work can now form a group, and each group gets one checklist. Click "＋ Group these repos" next to a client name in the sidebar, tick the repos and click Create group (or type the same Group in ⚙ Settings). Later, drag a project by its header onto a group box to add it, or onto its client name to take it out. The repos of the group then sit in one box under a bar like "☑ acme-product · 2 tickets · 1 needs you". Click the bar, and the checklist fills the big right area: what needs you now, each ticket with its plans, their step and their PR, the group's goals and rules from one ledger.md file, and an empty Questions area for now. With no plan open, the right area shows the checklist by itself. After the pull, run pgrep -fl chat-relay.mjs, and run npm run restart only when it shows that the live chats run under the relay. Then run npm run build-app and open Shipyard again for the new View → Checklist item.
internal: |
  New apps/dashboard/groups.mjs (no imports): safeGroup, parseTickets (the plan header's "- **Tickets**:" line), ticketKey, planStep, buildChain, groupSummary, ledgerTemplate. Registry entries take an optional "group" (lower case, 1-40 of A-Z a-z 0-9 . _ -); /api/state adds "group" and "groupInfo" ({ tickets, needsYou }, from buildChain + groupSummary) per project and "tickets" per plan. POST /api/registry also returns "warnings" (a list). New GET /api/ledger?group=<g> (400 bad group, 500 on a failed state build) and POST /api/ledger/open { group } (makes ~/.claude/pipeline-dashboard/groups/<g>/ledger.md once with flag wx, never overwrites, then opens it in VS Code). The server reads at most 256 KB of the ledger and decodes it with StringDecoder, so a cut character is dropped. Page: group box and groupBarHtml in renderList (a fold button cycles open → project headers only → hidden: groupFold/groupFoldNext, kept in dash-collapsed as "grp:<group>"), "＋ Group these repos" (openGroupForm, the #grpdlg dialog) and dragging a project header onto a group box or a client name (projDropGroup) both save through saveGroups → POST /api/registry, showChecklist/renderChecklist paint checklistHtml into #detail when no plan is open (the side pane on screens of 600 px or less), ledgerBody hides the template text and empty sections, a datalist of groups on the Settings Group input, palette entry and the window.dashboard.toggleChecklist hook. Shipyard: View → Checklist; it needs npm run build-app and a restart of the app.
customer:
  en: You can now group repos that share work and see one checklist per group in the main area of the dashboard, with what needs you, each ticket with its plans and pull requests, and the group's goals and rules. Click "＋ Group these repos" next to a client name to start.
