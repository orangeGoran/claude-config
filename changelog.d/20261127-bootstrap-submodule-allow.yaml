kind: fixed
audience: internal
scope: bootstrap-project
summary: |
  A chat that continues a pipeline run (for example /pr-feedback or /merge-parent) no longer asks for permission for each read-only command. The project settings now allow gh pr view, gh pr diff, gh pr list, git fetch, git ls-tree, git rev-parse and git cat-file. A project with git submodules also gets the git commands inside each submodule, for example `git -C contracts checkout <sha>`, with or without `--detach`. Push and PR write commands still ask. The rules come on the next bootstrap upgrade of the project.
internal: |
  render.mjs: the shared allow list gets the read-only git and gh pr rules; submodulePaths(repo) reads the paths from .gitmodules and submoduleAllow(paths) gives Bash(git -C <path> <verb>*) for fetch, status, rev-parse, log, show, diff, merge-base, cat-file, ls-tree, grep, checkout and switch --detach (paths with a space or a special character get none). verify.mjs push-allow now fails only on push and PR write rules (gh pr view, diff and list pass); lessons.md lesson 1 says so. Tests in test/bootstrap-project.test.mjs.
