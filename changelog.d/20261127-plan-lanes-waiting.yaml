kind: added
audience: internal
scope: bootstrap-project
summary: |
  A plan that waits for a condition (a `Waits for:` line in its header) is no longer suggested for launch by /plans-parallel and the suggested launch batch. It is listed as waiting, with its condition and a note when the dashboard's last check is old or missing. A ready plan that shares files with a waiting plan gets a warning line. Projects get this on the next bootstrap upgrade.
internal: |
  plan-lanes.mjs template: projectName() finds the dashboard state folder by the registry entry whose root is the repo or, in a linked worktree, its main checkout (real paths, ~ expanded), else the folder name of the main checkout; plan-meta.json, runs.json and plan-summaries.json now come from that folder too. waitsForLines() reads the header Waits for lines (fences skipped, backticks removed); waitStateOf() reads watch.json met[slug] and checkedAt and never checks a condition itself (met counts at any age, stale after 10 minutes; a plan with a run report gets a note, because the watcher never checks or starts it). readJson() reads a state file that holds null, a number or a string as {}, and the run report, shipped and branch-commit maps have no prototype (a plan named constructor). New JSON fields: plans[].waits, waiting, waitingCount, recommendedBatch[].sharesWithWaiting; new WAITING text section and ⏳WAITING lane mark. The plans-parallel skill template and contracts.md describe them. This repo's own .claude/scripts/plan-lanes.mjs and .claude/skills/plans-parallel/SKILL.md need a hand copy or /bootstrap-project --upgrade. Tests in test/bootstrap-project.test.mjs.
