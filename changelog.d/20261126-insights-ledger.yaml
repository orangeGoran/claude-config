kind: added
audience: internal
scope: dashboard
summary: |
  The dashboard now keeps one line per finished pipeline run in ~/.claude/pipeline-dashboard/insights.jsonl: the cost, the tokens, the cost and minutes of each phase, the mode, the outcome and the PR. The event watcher adds the line of a new run by itself. To add the old runs, run node apps/dashboard/insights.mjs --migrate once after the pull. After the pull, run pgrep -fl chat-relay.mjs, and run npm run restart only when it shows that the live chats run under the relay. The Insights page that reads this file comes in a later plan.
internal: |
  New apps/dashboard/insights.mjs: LEDGER, DEFAULT_STALE_MS, runRecord (one v:1 line from a run log and report, through parseLog/loadSubagents/phaseRows/applyCosts of .claude/scripts/run-usage.mjs), readLedger (last line per project/slug), pgrepLive, takeLedgerLock/releaseLedgerLock (insights.jsonl.lock, the watcher-lock algorithm; EPERM counts as alive), syncLedger (limit, maxBytes, staleMs, isLive, beforeWrite, a failed map retried after 10 minutes, dryRun) and registryProjects (auto-pipeline flavor only). The CLI --migrate [--dry-run] retries a busy lock every 2 s for 60 s and exits 1 on a read error. watchTick() calls syncLedger after the per-project loop (20 runs or 40 MB of logs per tick, beforeWrite: fence; LOST_LOCK goes up, other errors are logged). copyDashboard() in scripts/docs-media.mjs also copies .claude/scripts/run-usage.mjs, which the server now imports. A report-only change reuses the usage fields of the previous line; a null outcome, mode, PR or launch time keeps the previous value, so a cleanup keeps the outcome. A ledger or a registry that cannot be read (other than missing) stops the call or the command with exit 1; an append error stops the call; syncLedger gives the event loop a turn before each log read.
