<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Plans</title>
<link rel="icon" id="favicon" href="{{ICON}}">
<style><!--@CSS--></style>
<header class="mainhd"><div class="hdl"><h1><a href="/" id="home" title="close the open plan">Plans</a></h1><button id="hdmenuBtn" class="hdbtn" popovertarget="hdmenu" aria-haspopup="true" title="Board, Scout, Checklist, QA reports, Add project, Settings, alerts and theme">⋯</button><button id="dashCodeBtn" class="hdbtn" title="Open this dashboard's code in VS Code"><svg class="vsc-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="#007ACC" d="M23.15 2.587L18.21.21a1.494 1.494 0 0 0-1.705.29l-9.46 8.63-4.12-3.128a.999.999 0 0 0-1.276.057L.327 7.261A1 1 0 0 0 .326 8.74L3.899 12 .326 15.26a1 1 0 0 0 .001 1.479L1.65 17.94a.999.999 0 0 0 1.276.057l4.12-3.128 9.46 8.63a1.492 1.492 0 0 0 1.704.29l4.942-2.377A1.5 1.5 0 0 0 24 20.06V3.939a1.5 1.5 0 0 0-.85-1.352zm-5.146 14.861L10.826 12l7.178-5.448v10.896z"/></svg> Code</button></div>
  <div id="hdtabs"></div>
  <nav id="stabs" aria-label="Open plans" hidden></nav>
  <div class="hright"><button id="boardExit" class="hdbtn" hidden title="Leave the board">✕ Board</button><button id="bpClose" class="hdbtn" hidden title="Close the plan and show the whole board (Esc)">✕ Close plan</button>
  <span class="dim hdnote" aria-live="polite">loading…</span>
  <span class="hdwarn" id="connmsg" style="display:none"></span>
  <span class="hdrun" id="hdrun" style="display:none"></span>
  <span class="hdok" id="hdok" style="display:none"></span>
  <span class="hdusage" id="hdusage"></span></div></header>
<div id="hdmenu" class="hdmenu" popover>
  <button id="boardBtn" aria-pressed="false" title="All plans on one board: Backlog, Ready, Running, Needs you, Failed, Done">▦ Board</button>
  <button id="scoutBtn" title="The scout: what it found, its last runs, its log and setup">🔭 Scout</button>
  <button id="checkBtn" title="One checklist per group of repos: goals, holds, and each ticket with its plans and PRs">☑ Checklist</button>
  <button id="noteBtn" aria-pressed="false" title="A sticky note over the page. Drag it by its top bar. It stays in this browser.">📝 Note</button>
  <a class="hdlink" id="qaLink" href="http://localhost:{{QA_PORT}}/" target="_blank" rel="noopener" title="report pages of the browser-usability-test skill">QA reports ↗</a>
  <hr>
  <button id="guidebtn" title="find repos on this machine and add them; step 1 explains how it works">＋ Add project</button>
  <button id="settingsbtn" title="projects &amp; settings">⚙ Settings</button>
  <button id="alertBtn" aria-pressed="false" title="Sound and notification when a run stops or the agent answers">🔕 Alerts off</button>
  <button id="themeBtn" title="toggle light/dark">🌙 Dark theme</button>
  <div class="hmfoot dim">Last update <span id="clock"></span></div>
</div>
<div class="wrap">
  <aside>
    <div class="filters">
      <input id="q" type="search" autocomplete="off" spellcheck="false" title="Esc or ✕ clears" placeholder="search plans, archived too…">
      <button id="suggestAll" title="Suggest one parallel launch batch across all projects">⚡ All</button>
      <button id="collapseAll" title="collapse or expand all project sections">Collapse all</button>
    </div>
    <div class="sidescroll">
      <div class="runstrip" id="runstrip"></div>
      <div class="items" id="side"></div>
    </div>
    <div class="launchbar">
      <span id="selcount" class="dim">0 queued</span>
      <span class="dim" id="selmodes"></span>
      <span style="flex:1"></span>
      <button class="primary" id="launchbtn">▶ Launch queued in parallel</button>
    </div>
  </aside>
  <div class="csplit" id="asplit" role="separator" aria-orientation="vertical" tabindex="0"
    aria-label="Divider between the plan list and the page" title="Drag to resize the plan list. Double-click: default width."></div>
  <div class="maincol">
  <div class="mainrow">
  <section id="detail"><span class="dim">Select a plan on the left.</span></section>
  <section id="board" hidden aria-label="Board of all plans"></section>
  <div class="csplit" id="csplit" role="separator" aria-orientation="vertical" tabindex="0" hidden
    aria-label="Divider between the page and the chat" title="Drag to resize the chat. Double-click: default width."></div>
  <section id="chat" hidden aria-label="Chat with the agent"></section>
  </div>
  </div>
</div>
<div id="logpane">
  <div class="csplit" id="lsplit" role="separator" aria-orientation="vertical" tabindex="0"
    aria-label="Divider between the page and the side pane" title="Drag to resize the side pane. Double-click: default width."></div>
  <header><h1 id="logtitle"></h1><span style="margin-left:auto"></span>
    <button id="backBtn" style="display:none">‹ Back</button>
    <button onclick="closeLog()">✕ close</button></header>
  <div id="logbody"></div>
</div>
<div id="onb" role="dialog" aria-modal="true" aria-labelledby="onbtitle">
  <div class="onb-box">
    <div class="onb-top"><h1 id="onbtitle" style="font-size:14px">Plans</h1><div class="steps" id="onbsteps"></div>
      <span style="flex:1"></span><button class="onb-x" id="onbskip" title="close (Esc)">Skip for now</button></div>
    <div class="onb-body" id="onbbody"></div>
    <div class="onb-foot"><button class="linkbtn" id="onbback">Back</button><span style="flex:1"></span>
      <button class="primary" id="onbnext">Continue</button></div>
  </div>
</div>
<dialog id="seldlg" aria-labelledby="seldlgt"><div class="seldlg-top"><b id="seldlgt"></b><span style="flex:1"></span>
  <button class="ccopy" id="seldlgcopy">Copy</button><button class="onb-x" id="seldlgx" title="Close (Esc)">✕</button></div>
  <p id="seldlgnote" hidden></p><pre id="seldlgbody"></pre></dialog>
<div id="palette" class="palette" role="dialog" aria-modal="true" aria-label="Command palette" hidden><input id="palq" type="search" autocomplete="off" spellcheck="false" aria-label="Search plans and actions" placeholder="Search plans and actions…"><div id="pall" role="listbox"></div></div>
<div id="mergedcard" role="dialog" aria-label="PR merged" hidden></div>
<div id="note" class="note" role="dialog" aria-label="Sticky note" hidden><div class="notebar" id="notebar" title="Drag to move">
  <button class="notelight notex" id="notex" title="Hide the note. Its text stays." aria-label="Hide note"><span>×</span></button><button class="notelight notemin" id="notemin" title="Minimize the note to a small button. Click the button to open it again." aria-label="Minimize note"><span>–</span></button><span style="flex:1"></span><span class="notecolors"><button data-color="yellow" aria-label="Yellow"></button><button data-color="green" aria-label="Green"></button><button data-color="blue" aria-label="Blue"></button><button data-color="pink" aria-label="Pink"></button></span></div>
  <div class="notebody"><div id="notemirror" class="notemirror" aria-hidden="true"></div><textarea id="notetext" spellcheck="false" placeholder="Write a note…" aria-label="Note text"></textarea></div><div class="notegrip" id="notegrip" title="Drag to resize" aria-hidden="true"></div></div>
<button id="notefab" class="notefab" title="Open the sticky note" aria-label="Open the sticky note" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7h10M5 10.5h10M5 14h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
<div id="toasts" role="status" aria-live="polite"><div id="toastList"></div><button id="toastPill" class="toastPill" hidden></button></div>
<div id="tour"><div id="tourblock"></div><div id="tourhole"></div>
  <div id="tourpop" role="dialog" aria-live="polite"></div></div>
<script><!--@JS--></script>
