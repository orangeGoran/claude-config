# .github/workflows/changelog-gate.yml
# Fails a pull request that adds no file under changelog.d/, that has an entry
# with a missing or wrong field, or that does not raise the version by one step
# (when the project has a version file). The rules are in
# .claude/scripts/changelog-validate.mjs (no dependencies; the runner's node runs it).
#
# A separate workflow, not a job in a CI workflow: it listens for `labeled` and
# `unlabeled`, so the `no-changelog` label runs the check again by itself
# without a new push. It needs no secrets.
#
# It blocks a merge only through branch protection: "Changelog Gate" must be a
# required status check on @@BASE_BRANCH@@. Otherwise a red result only reports.
#
# Escape hatch: put the label `no-changelog` on the PR. The entry files are still
# checked, so a broken file never waits for the release to fail.

name: Changelog Gate

on:
  pull_request:
    # `labeled` and `unlabeled` are not in the default set. Without them, the
    # `no-changelog` label does not run the check again.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [@@BASE_BRANCH@@]

permissions:
  contents: read

concurrency:
  group: changelog-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog-gate:
    name: Changelog Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # the check compares with the merge base, which a shallow clone does not have
          fetch-depth: 0
          persist-credentials: false

      - name: Check the changelog entries and the version
        env:
          BASE_REF: ${{ github.base_ref }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          if [ "$SKIP" = "true" ]; then
            node .claude/scripts/changelog-validate.mjs --base "origin/$BASE_REF" --skip-required
          else
            node .claude/scripts/changelog-validate.mjs --base "origin/$BASE_REF"
          fi
